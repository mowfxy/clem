<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clem Thinking Pinwheel</title><style>.clem-pinwheel{position:relative;display:inline-block;vertical-align:middle}
.clem-pinwheel i{--turn:0deg;position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:0 100% 0 100%;background:currentColor;transform-origin:0 0;transform:rotate(calc(var(--turn) - 45deg));animation:clem-pinwheel 1.7s cubic-bezier(.6,0,.3,1) -.2s infinite}
.clem-pinwheel i:nth-child(2){--turn:120deg;opacity:.72;animation-delay:-.1s}.clem-pinwheel i:nth-child(3){--turn:240deg;opacity:.46;animation-delay:0s}
@keyframes clem-pinwheel{from{transform:rotate(calc(var(--turn) - 45deg)) scale(.78)}50%{transform:rotate(calc(var(--turn) + 135deg)) scale(1)}to{transform:rotate(calc(var(--turn) + 315deg)) scale(.78)}}
@media(prefers-reduced-motion:reduce){.clem-mark,.clem-mark *{animation:none!important}}[data-quiet=true] .clem-mark,[data-quiet=true] .clem-mark *{animation:none!important}
