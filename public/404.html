<style>
/* Served by Vercel for any path that doesn't exist on clem.m4labs.xyz. Self-contained: the app's CSS is bundled. */
@font-face{font-family:"Clem Mono";src:url(/fonts/JetBrainsMono.woff2) format("woff2");font-weight:100 800;font-display:swap}
@font-face{font-family:"Clem Wordmark";src:url(/fonts/Outfit.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#0b0b0a;--line:#23231f;--text:#F4F2EC;--dim:#8a897f;--faint:#55554f;--mono:"Clem Mono",ui-monospace,Consolas,monospace;--pad:clamp(16px,4vw,48px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--mono);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:4px;transition:text-decoration-color .2s}
a:hover{text-decoration-color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
::selection{background:var(--text);color:var(--bg)}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 var(--pad)}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none}
.brand .wordmark{font:600 25px/1 "Clem Wordmark",system-ui,sans-serif;letter-spacing:-.02em;margin-top:-2px}
.lab{font-size:12px;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.lab:hover{color:var(--text);border-color:var(--faint)}
main{flex:1;display:flex;align-items:center;padding:clamp(28px,6vh,72px) 0}
.ascii{margin:0 0 28px;width:100%;height:clamp(180px,38vh,360px);overflow:hidden;font:400 clamp(9px,1.1vw,13px)/1.15 var(--mono);color:var(--text);white-space:pre;user-select:none}
.measure{visibility:hidden;position:absolute}
.prompt{color:var(--dim);margin:0 0 6px}
.prompt b{color:var(--faint);font-weight:400}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--text);vertical-align:-.18em;margin-left:2px;animation:blink 1.1s steps(1) infinite}
h1{font-size:clamp(26px,4vw,40px);line-height:1.15;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.links{display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--dim);margin:0}
.links a{color:var(--text)}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
footer a{color:var(--dim)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>

<body>
<header><div class="wrap">

<main><div class="wrap">
  <pre class="ascii" id="lost" aria-hidden="true"></pre>
  <p class="prompt"><b>~/clem $</b> cd <span id="path">here</span><span class="cursor"></span></p>

  <p class="links"><a href="/">cd ~</a><a href="/#/features">features</a><a href="/#/support">support</a></p>
</div></main>
<footer><div class="wrap"><span>404 · not found</span><a href="https://m4labs.xyz">m4labs.xyz</a></div></footer>
<script>
// A search beam wanders a dark field and shows "404" only where it passes, then opens wide to find it (as on m4labs.xyz).
(() => {
  const pre = document.getElementById('lost');
  const path = document.getElementById('path');
  const shown = location.pathname.length > 1 ? location.pathname.slice(0, 40) : 'here';
  path.textContent = shown;
  const RAMP = ' .:-=+*#%@', SCRAMBLE = '!<>-_\\/[]{}=+*^?#%&$01';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  const ramp = (d) => RAMP[Math.max(0, Math.min(RAMP.length - 1, Math.round(d * (RAMP.length - 1))))];
  let c, r, k, dens, raf = 0, last = 0, t0 = performance.now() / 1000;

  function sample() {
    const s = 4, W = c * s, H = Math.max(1, Math.round(r * k * s));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.font = '600 100px "Clem Wordmark", system-ui, sans-serif';
    const m = cx.measureText('404'), tw = m.width, th = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || 100;
    const f = Math.min((W * 0.9) / tw, (H * 0.86) / th);
    cx.setTransform(f, 0, 0, f, (W - tw * f) / 2, (H - th * f) / 2 + m.actualBoundingBoxAscent * f);
    cx.fillText('404', 0, 0);
    const px = cx.getImageData(0, 0, W, H).data, out = new Float32Array(c * r), ch = H / r;
    for (let y = 0; y < r; y++) for (let x = 0; x < c; x++) {
      let a = 0, n = 0;
      for (let j = Math.floor(y * ch); j < Math.floor((y + 1) * ch); j++) for (let i = x * s; i < (x + 1) * s; i++) { a += px[(j * W + i) * 4 + 3]; n++; }
      out[y * c + x] = n ? a / n / 255 : 0;
    }
    return out;
  }

  function init() {
    const m = document.createElement('span'); m.className = 'measure'; m.textContent = 'M'.repeat(40); pre.appendChild(m);
    const w = m.offsetWidth / 40 || 8, h = parseFloat(getComputedStyle(pre).lineHeight) || 14; m.remove();
    c = Math.max(8, Math.floor(pre.clientWidth / w)); r = Math.max(4, Math.floor(pre.clientHeight / h)); k = h / w;
    dens = sample();
  }

  function draw(t) {
    const P = 9, p = t % P, full = Math.hypot(c, r * k);
    const open = p < 6 ? 0 : p < 6.8 ? ease((p - 6) / 0.8) : p < 8.2 ? 1 : 1 - ease((p - 8.2) / 0.8);
    const rad = Math.min(c, r * k) * 0.24 + open * full;
    const bx = c / 2 + Math.sin(t * 0.53) * c * 0.34, by = r / 2 + Math.sin(t * 0.81 + 1) * r * 0.32;
    const drift = Math.floor(t * 3);
    let s = '';
    for (let y = 0; y < r; y++) {
      for (let x = 0; x < c; x++) {
        const d = dens[y * c + x], q = Math.hypot(x - bx, (y - by) * k);
        if (q < rad - 1.5) s += d > 0.03 ? ramp(Math.max(0.12, d * (0.9 + 0.1 * Math.sin(x * 0.07 - t * 0.5)))) : hash(x, y) > 0.97 ? '.' : ' ';
        else if (q < rad + 1.5) s += Math.random() < 0.55 ? SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0] : ' ';
        else s += hash(x, y + drift) > (d > 0.03 ? 0.9 : 0.985) ? '.' : ' ';
      }
      if (y < r - 1) s += '\n';
    }
    pre.textContent = s;
  }

  function tick(ms) {
    raf = 0;
    if (document.hidden || reduced.matches) return;
    if (ms - last > 40) { last = ms; draw(ms / 1000 - t0); }
    raf = requestAnimationFrame(tick);
  }
  function run() { if (reduced.matches) draw(7.5); else if (!raf) raf = requestAnimationFrame(tick); }

  let rz;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { init(); draw(reduced.matches ? 7.5 : performance.now() / 1000 - t0); }, 150); });
  document.addEventListener('visibilitychange', run);
  reduced.addEventListener?.('change', run);
  document.fonts.load('600 100px "Clem Wordmark"').catch(() => {}).then(() => { init(); draw(reduced.matches ? 7.5 : 0); run(); });
})();
</script>
</body>
