name: Application checks
# Pushes to branches are checked through their pull request, so each change runs once instead of twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces its run still going; every commit on main keeps its own result.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # Pinned so the move of ubuntu-latest to a new image cannot change the machine under the tests without a commit.
    runs-on: ubuntu-24.04
    # A healthy run takes about 2 minutes; a hung test or runner fails here instead of holding the queue for 45.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm test
      # Electron's SUID sandbox helper is not set up on the runner, and its windows need a display.
      - run: xvfb-run -a npm run test:desktop
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - run: npx tsc -p desktop/tsconfig.json
      - run: npm run typecheck:server
      - run: npm run build:vercel
      - run: node scripts/check-performance-budget.mjs
