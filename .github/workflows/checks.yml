name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm test
      # Electron's SUID sandbox helper is not set up on the runner, and its windows need a display.
      - run: xvfb-run -a npm run test:desktop
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - run: npx tsc -p desktop/tsconfig.json
      - run: npm run typecheck:server
      - run: npm run build:vercel
      - run: node scripts/check-performance-budget.mjs
